name: Build Molektra

on:
  workflow_dispatch:        
  push:
    tags:
      - 'v*'            

jobs:
  build:
    strategy:
      fail-fast: false     
      matrix:
        include:
          - os: macos-13
            name: macOS
            sep: ':'
          - os: ubuntu-22.04
            name: Linux
            sep: ':'
          - os: windows-latest
            name: Windows
            sep: ';'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --onedir --windowed \
            --paths=. \
            --collect-submodules gui \
            --collect-submodules molecule \
            --collect-submodules utils \
            --collect-submodules ase --collect-data ase \
            --collect-submodules cosymlib --collect-data cosymlib \
            --collect-submodules posym --collect-data posym \
            --add-data "gui${{ matrix.sep }}gui" \
            main.py

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" == "macOS" ]; then
            zip -r ../Molektra-${{ matrix.name }}.zip main.app
          elif [ "${{ runner.os }}" == "Windows" ]; then
            7z a ../Molektra-${{ matrix.name }}.zip main
          else
            zip -r ../Molektra-${{ matrix.name }}.zip main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Molektra-${{ matrix.name }}
          path: Molektra-${{ matrix.name }}.zip
